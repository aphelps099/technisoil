<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechniSoil Brand House — Hero Sample</title>

    <!-- Google Fonts (matching Brand House) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Zalando+Sans:wght@300;400;500;600;700;800&family=Zalando+Sans+Expanded:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Brand House Palette */
            --navy: #1a3a52;
            --slate: #6b7280;
            --sand: #c9a86a;
            --sand-light: #d4b87a;
            --brown: #8b6f47;
            --terracotta: #c17855;
            --forest: #4a6741;
            --sage: #7a8a6f;
            --teal: #2d7b7e;
            --turquoise: #5fa5a5;
            --sky: #9fb8c7;
            --cream: #f5ead8;
            --white: #ffffff;
            --black: #0d0d0d;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Zalando Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--white);
            background: var(--black);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-weight: 300;
        }

        /* ========================================
           NAVIGATION
        ======================================== */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 0 60px;
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .nav-brand {
            font-family: 'Zalando Sans', sans-serif;
            font-size: 0.875rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--white);
            text-decoration: none;
            text-transform: uppercase;
            transition: letter-spacing 0.3s ease;
        }

        .nav-brand:hover {
            letter-spacing: 0.25em;
        }

        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nav-link {
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--white);
            text-decoration: none;
            text-transform: uppercase;
            padding: 14px 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--white);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .nav-link:hover {
            color: var(--black);
            border-color: var(--white);
        }

        .nav-link:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* ========================================
           HERO SECTION
        ======================================== */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: var(--black);
        }

        /* Animated Swoosh Background */
        .swoosh-bg {
            position: absolute;
            width: 200%;
            height: 100%;
            left: -50%;
            top: 0;
            z-index: 1;
            pointer-events: none;
        }

        .swoosh-bg svg {
            width: 100%;
            height: 100%;
            position: absolute;
        }

        .swoosh-path-1 {
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawSwoosh 2.5s ease-out 0.3s forwards;
        }

        .swoosh-path-2 {
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawSwoosh 2.5s ease-out 0.5s forwards;
        }

        .swoosh-path-3 {
            stroke-dasharray: 3000;
            stroke-dashoffset: 3000;
            animation: drawSwoosh 2.5s ease-out 0.7s forwards;
        }

        @keyframes drawSwoosh {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Grain Texture */
        .grain {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Side Accents */
        .hero-accent {
            position: absolute;
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.15);
            writing-mode: vertical-rl;
            z-index: 3;
        }

        .hero-accent-left {
            left: 40px;
            top: 50%;
            transform: translateY(-50%) rotate(180deg);
        }

        .hero-accent-right {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Hero Content */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 40px;
            max-width: 1200px;
        }

        /* Eyebrow */
        .hero-eyebrow {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--sand);
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: heroFadeUp 1s ease 1.8s forwards;
        }

        /* Main Title */
        .hero-title {
            font-family: 'Zalando Sans Expanded', sans-serif;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -0.02em;
            color: var(--white);
            text-transform: uppercase;
        }

        .hero-title-line {
            display: block;
            overflow: hidden;
        }

        .hero-title-line span {
            display: inline-block;
            opacity: 0;
            transform: translateY(100%);
            animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero-title-line:nth-child(1) span {
            animation-delay: 2s;
        }

        .hero-title-line:nth-child(2) span {
            animation-delay: 2.2s;
        }

        .hero-title-accent {
            color: var(--sand);
        }

        @keyframes heroReveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes heroFadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tagline */
        .hero-tagline {
            font-family: 'IBM Plex Serif', Georgia, serif;
            font-size: clamp(1rem, 2vw, 1.25rem);
            font-weight: 400;
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            max-width: 600px;
            margin: 48px auto 0;
            line-height: 1.7;
            opacity: 0;
            transform: translateY(20px);
            animation: heroFadeUp 0.8s ease-out 2.6s forwards;
        }

        /* CTA Buttons */
        .hero-cta-wrap {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: heroFadeUp 0.8s ease-out 2.8s forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 20px 48px;
            font-family: 'Zalando Sans', sans-serif;
            font-size: 0.8125rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: var(--sand);
            color: var(--black);
            border: 2px solid var(--sand);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--sand-light);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(201, 168, 106, 0.3);
        }

        .btn-primary:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-secondary {
            background: transparent;
            color: var(--white);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--white);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .btn-secondary:hover {
            color: var(--black);
            border-color: var(--white);
        }

        .btn-secondary:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-arrow {
            transition: transform 0.4s ease;
        }

        .btn:hover .btn-arrow {
            transform: translateX(8px);
        }

        /* Scroll Indicator */
        .hero-scroll {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
            opacity: 0;
            animation: heroFadeUp 1s ease 3.2s forwards;
        }

        .hero-scroll-text {
            font-size: 0.625rem;
            font-weight: 600;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
        }

        .hero-scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--sand), transparent);
            animation: scrollPulse 2s ease-in-out infinite;
        }

        @keyframes scrollPulse {
            0%, 100% {
                opacity: 1;
                transform: scaleY(1);
            }
            50% {
                opacity: 0.5;
                transform: scaleY(0.7);
            }
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 1024px) {
            .nav {
                padding: 0 40px;
            }

            .hero-accent {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .nav {
                padding: 0 24px;
            }

            .nav-links {
                display: none;
            }

            .hero-content {
                padding: 0 24px;
            }

            .hero-eyebrow {
                font-size: 0.625rem;
                margin-bottom: 24px;
            }

            .hero-title {
                font-size: clamp(2rem, 12vw, 4rem);
            }

            .hero-tagline {
                font-size: 1rem;
                margin-top: 32px;
            }

            .hero-cta-wrap {
                flex-direction: column;
                align-items: center;
                margin-top: 40px;
            }

            .btn {
                padding: 16px 32px;
                font-size: 0.75rem;
                width: 100%;
                max-width: 280px;
                justify-content: center;
            }

            .hero-scroll {
                bottom: 24px;
            }

            .hero-scroll-line {
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-content">
            <a href="#" class="nav-brand">TechniSoil Brand House</a>
            <div class="nav-links">
                <a href="#" class="nav-link">Resources</a>
                <a href="#" class="nav-link">Videos</a>
                <a href="#" class="nav-link">Support</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <!-- Animated Swoosh Background -->
        <div class="swoosh-bg">
            <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
                <!-- Teal swoosh (sky) - top -->
                <path class="swoosh-path-1"
                      d="M-100,300 C200,450 500,500 800,400 C1100,300 1400,350 1700,450"
                      stroke="rgba(45, 123, 126, 0.15)"
                      stroke-width="200"
                      fill="none"
                      stroke-linecap="round"/>

                <!-- Sand swoosh - middle -->
                <path class="swoosh-path-2"
                      d="M-100,500 C250,350 550,300 850,420 C1150,540 1450,480 1700,380"
                      stroke="rgba(201, 168, 106, 0.2)"
                      stroke-width="180"
                      fill="none"
                      stroke-linecap="round"/>

                <!-- Accent swoosh - thin line -->
                <path class="swoosh-path-3"
                      d="M-50,420 C220,520 520,540 820,440 C1120,340 1420,380 1700,460"
                      stroke="rgba(201, 168, 106, 0.4)"
                      stroke-width="4"
                      fill="none"
                      stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Grain Texture -->
        <div class="grain"></div>

        <!-- Side Accents -->
        <div class="hero-accent hero-accent-left">Est. 2006 California</div>
        <div class="hero-accent hero-accent-right">Dealer Partner Network</div>

        <!-- Main Content -->
        <div class="hero-content">
            <!-- Eyebrow -->
            <div class="hero-eyebrow">TechniSoil Dealer Network</div>

            <!-- Main Title -->
            <h1 class="hero-title">
                <span class="hero-title-line"><span>Brand</span></span>
                <span class="hero-title-line"><span class="hero-title-accent">House</span></span>
            </h1>

            <!-- Tagline -->
            <p class="hero-tagline">
                Your central hub for dealer resources, marketing assets, and everything you need to grow with TechniSoil.
            </p>

            <!-- CTA Buttons -->
            <div class="hero-cta-wrap">
                <a href="#" class="btn btn-primary">
                    Explore Resources
                    <span class="btn-arrow">→</span>
                </a>
                <a href="#" class="btn btn-secondary">
                    Watch Videos
                    <span class="btn-arrow">→</span>
                </a>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="hero-scroll">
            <span class="hero-scroll-text">Scroll</span>
            <div class="hero-scroll-line"></div>
        </div>
    </section>
</body>
</html>
